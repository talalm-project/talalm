services:
  rustfs-perms:
    image: alpine:latest
    container_name: talalm-rustfs-perms
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    command: >
      sh -c "chown -R 10001:10001 /data /logs"
    restart: "no"

  rustfs:
    image: rustfs/rustfs:latest
    container_name: talalm-rustfs
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_OBS_LOGGER_LEVEL: info
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  rustfs_data:
  rustfs_logs:
